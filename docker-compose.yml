services:
  # 1. Web Portal & REST API Server (Node.js)
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: abhijnana-api
    restart: unless-stopped
    ports:
      - "4317:4317" # Exposes the combined React frontend and API on port 4317
    depends_on:
      - engine
      - redis
    environment:
      - NODE_ENV=production
      - PORT=4317
      - ENGINE_URL=http://engine:4318
      - REDIS_URL=redis://redis:6379
    volumes:
      - api_db:/app/server/data       # SQLite database file
      - api_keys:/app/server/keys     # ed25519 Signing keypair
      - api_uploads:/app/server/uploads # Temporary file uploads

  # 2. Python Matching & Fingerprinting Engine
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: abhijnana-engine
    restart: unless-stopped
    volumes:
      - engine_data:/app/data        # FAISS index storage
    environment:
      - PYTHONUNBUFFERED=1

  # 3. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: abhijnana-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

volumes:
  api_db:
  api_keys:
  api_uploads:
  engine_data:
  redis_data:
