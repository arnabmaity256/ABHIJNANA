# Nginx Configuration for ABHIJÑĀNA (Cloudflare Tunnel Setup)
# Runs locally on HTTP Port 80. SSL is handled by Cloudflare Tunnel.

server {
    listen 80;
    server_name abhijnana.rkmvcse.in admin.abhijnana.rkmvcse.in;

    # Root directory pointing to the compiled React web bundle.
    # NOTE: Update this path to the actual directory of the cloned repository on the server.
    root /var/www/abhijnana/web/dist;
    index index.html;

    client_max_body_size 500M; # Support large video uploads for verification and ingest

    # Serve static assets or fallback to index.html for client-side routing (React SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the local Node.js backend
    location /api {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
